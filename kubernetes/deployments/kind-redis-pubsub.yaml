---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-sa
  namespace: keda
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: keda-binding
subjects:
  - kind: ServiceAccount
    name: keda-sa
    namespace: keda
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: keda
  namespace: keda
  labels:
    k8s-app: keda
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: default
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: keda
  template:
    metadata:
      labels:
        k8s-app: keda
        app.default.com/name: keda
        app.kubernetes.io/name: keda
        app.kubernetes.io/part-of: default
    spec:
      serviceAccountName: keda-sa
      containers:
        - name: keda
          image: keda:0ee3b8e
          imagePullPolicy: Never
          env:
            - name: CONFIGWATCHER_TYPE
              value: "configmap"
            - name: CONFIGWATCHER_SOURCE_OPTIONS
              value: "name:keda-config,namespace:keda,key:config.yaml"
            - name: RESYNC_TIME_DURATION
              value: "1440m"
            - name: CLUSTER_NAME
              value: "kind-kind"
            - name: CMDRUNNER_SEMAPHORE_MAX
              value: "5"
            - name: CMDRUNNER_SEMAPHORE_TIMEOUT
              value: "20m"
            - name: LOG_LEVEL
              value: "debug"
            - name: "CACHE_TYPE"
              value: "redis"
            - name: "CACHE_TTL"
              value: "14400m"
            - name: "CACHE_HOST"
              value: "redis-service.default:6379"
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          volumeMounts:
            - name: pub-sub-scripts
              mountPath: /home/scripts
              readOnly: true
      volumes:
        - name: pub-sub-scripts
          configMap:
            name: keda-pub-sub-scripts
            defaultMode: 0555

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-config
  namespace: keda
data:
  config.yaml: |
    events:
      - name: ns-created
        inbound:
          kind: namespace
          action: create
          namespace: default
        outbound:
          kind: cmd
          action: "/home/scripts/pub-sub-send.sh namespace new-resource-created-alert"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-pub-sub-scripts
  namespace: keda
data:
  pub-sub-send.sh: |
    #!/bin/bash

    set -euo pipefail

    if [[ $# -ne 4 || -z $1 || -z $2 || -z $3 || -z $4 ]]; then
        echo "Usage: $0 <kind> <topic> <name> <namespace>" >&2
        exit 1
    fi

    kind="$1"
    topic="$2"
    name="$3"
    namespace="$4"
    start=$(date +%s)-$$
    msg=$(jq -cn \
        --arg kind "$kind" \
        --arg name "$name" \
        --arg namespace "$namespace" \
        --arg start "$start" \
        '{kind: $kind, name: $name, namespace: $namespace, start: $start}')

    echo "Publishing $kind $name in namespace $namespace to topic $topic"
    gcloud pubsub topics publish "$topic" \
        --message="$msg"
