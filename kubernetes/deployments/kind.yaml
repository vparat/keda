---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-sa
  namespace: default
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: keda-binding
subjects:
  - kind: ServiceAccount
    name: keda-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: keda
  namespace: default
  labels:
    k8s-app: keda
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: default
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: keda
  template:
    metadata:
      labels:
        k8s-app: keda
        app.default.com/name: keda
        app.kubernetes.io/name: keda
        app.kubernetes.io/part-of: default
    spec:
      serviceAccountName: keda-sa
      containers:
        - name: keda
          image: keda:c453b6d
          imagePullPolicy: Always
          # command: [ "tail","-f","/dev/null"]
          env:
            - name: GOOGLE_CLOUD_PROFILING
              value: ""
            - name: RESYNC_TIME_DURATION
              value: "1440m"
            - name: CLUSTER_NAME
              value: "kind-kind"
            - name: CMDRUNNER_SEMAPHORE_MAX
              value: "5"
            - name: CMDRUNNER_SEMAPHORE_TIMEOUT
              value: "20m"
            - name: "CACHE_TYPE"
              value: "noop"
            - name: "CACHE_TTL"
              value: "14400m"
            - name: "CACHE_HOST"
              value: "redis01:6379"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1500m
              memory: 512Mi
          volumeMounts: []

