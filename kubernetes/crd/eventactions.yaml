apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: eventactions.keda.vparat.github.com
spec:
  group: keda.vparat.github.com
  scope: Namespaced
  names:
    plural: eventactions
    singular: eventaction
    kind: EventAction
    shortNames:
      - ea
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.inbound.kind
        - name: Event
          type: string
          jsonPath: .spec.inbound.action
        - name: Disabled
          type: boolean
          jsonPath: .spec.disabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - inbound
                - outbound
              properties:
                disabled:
                  type: boolean
                  default: false
                  description: Whether this event action is disabled.
                inbound:
                  type: object
                  description: Kubernetes resource events that trigger the action.
                  required:
                    - kind
                    - action
                  properties:
                    kind:
                      type: string
                      minLength: 1
                      description: Resource kind to watch, such as deployment or pod.
                    action:
                      type: string
                      enum:
                        - create
                        - update
                        - delete
                    namespace:
                      type: string
                      description: Namespace to watch. Empty means all namespaces.
                    label:
                      type: string
                      description: Kubernetes label selector used to filter resources.
                outbound:
                  type: object
                  description: Command to execute when a matching event is received.
                  required:
                    - kind
                    - action
                  properties:
                    kind:
                      type: string
                      enum:
                        - cmd
                    action:
                      type: string
                      minLength: 1
                      description: Shell command to execute.
